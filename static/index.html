<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁轉 Markdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 800px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="url"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            display: none;
            margin-top: 30px;
        }
        .result.show {
            display: block;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .result-title {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }
        .download-btn {
            padding: 10px 20px;
            background: #10b981;
        }
        .download-btn:hover {
            background: #059669;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4);
        }
        textarea {
            width: 100%;
            height: 400px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Monaco', 'Menlo', monospace;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            display: none;
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 網頁轉 Markdown <small style="font-size:12px;color:#999">v5</small></h1>
        
        <div class="input-group">
            <input type="url" id="urlInput" placeholder="輸入網頁網址，例如：https://example.com/article" required>
            <button id="convertBtn">轉換</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在抓取網頁...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <div class="result-header">
                <span class="result-title" id="resultTitle"></span>
                <button class="download-btn" id="downloadBtn">下載 .md</button>
            </div>
            <textarea id="markdownOutput" readonly></textarea>
        </div>
    </div>

    <script>
        let currentMarkdown = '';
        let currentTitle = '';

        document.getElementById('convertBtn').addEventListener('click', convert);
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') convert();
        });
        document.getElementById('downloadBtn').addEventListener('click', download);

        async function convert() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;

            // 隐藏之前的结果和错误
            document.getElementById('result').classList.remove('show');
            document.getElementById('error').classList.remove('show');
            
            // 显示加载动画
            document.getElementById('loading').classList.add('show');
            document.getElementById('convertBtn').disabled = true;

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || '轉換失敗');
                }

                currentMarkdown = data.markdown;
                currentTitle = data.title || 'untitled';

                document.getElementById('resultTitle').textContent = currentTitle;
                document.getElementById('markdownOutput').value = currentMarkdown;
                document.getElementById('result').classList.add('show');

            } catch (err) {
                document.getElementById('error').textContent = err.message;
                document.getElementById('error').classList.add('show');
            } finally {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('convertBtn').disabled = false;
            }
        }

        function download() {
            if (!currentMarkdown) return;

            // 清理文件名
            const filename = currentTitle
                .replace(/[\\/:*?"<>|]/g, '')
                .replace(/\s+/g, '-')
                .substring(0, 50) + '.md';

            const blob = new Blob([currentMarkdown], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
